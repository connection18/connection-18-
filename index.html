
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>CONNECTION 18+</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial}
header{background:#151515;padding:20px;text-align:center;border-bottom:2px solid red}
header h1{color:#ff2525;margin:0}
.container{max-width:850px;margin:auto;padding:15px}
button{background:#e50914;color:white;border:0;padding:12px;border-radius:6px;cursor:pointer}
input,textarea{width:100%;padding:12px;margin:8px 0;background:#222;color:white;border:1px solid #444;border-radius:6px}
.card{background:#181818;margin:15px 0;border-radius:10px;overflow:hidden}
.player{position:relative;width:100%;aspect-ratio:16/9;background:black}
.player iframe{width:100%;height:100%;position:absolute;inset:0;border:0}
.info{padding:14px}
#admin{display:none;background:#171717;padding:15px;border-radius:10px;margin:15px 0}
.small{font-size:13px;color:#aaa}
.status{text-align:center;color:#aaa;padding:12px}
</style>
</head>

<body>

<header>
<h1>CONNECTION 18+</h1>
<p>Karibu kwenye maktaba yetu ya video</p>
</header>

<div class="container">

<button onclick="showLogin()">ADMIN LOGIN</button>

<div id="admin">
<h2>ADMIN DASHBOARD</h2>

<div id="loginBox">
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Admin password">
<button onclick="login()">INGIA</button>
</div>

<div id="panel" style="display:none">
<h3>Ongeza video mpya</h3>
<input id="title" placeholder="Jina la video">
<textarea id="embed" rows="4" placeholder="Bandika Embed Code hapa"></textarea>
<button onclick="addVideo()">ADD VIDEO</button>
<button onclick="logout()" style="background:#555">LOGOUT</button>
</div>

<p class="small" id="adminStatus">Admin wa tovuti</p>
</div>

<h2>Video Zetu</h2>
<div class="status" id="status">Inaunganisha...</div>
<div id="videos"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

// FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyCYCriveNctKXLDV3nvhwskrx4N_jCTziE",
  authDomain: "connection-18-c5446.firebaseapp.com",
  databaseURL: "https://connection-18-c5446-default-rtdb.firebaseio.com",
  projectId: "connection-18-c5446",
  storageBucket: "connection-18-c5446.firebasestorage.app",
  messagingSenderId: "456365988687",
  appId: "1:456365988687:web:f1fbb5ec4996c96b79833a"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let isAdmin = false;
let allVideos = {};

// SHOW ADMIN

function showLogin(){
 document.getElementById("admin").style.display="block";
}

// AUTHENTICATION

function login(){

 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 if(!email || !password){
  alert("Jaza email na password");
  return;
 }

 auth.signInWithEmailAndPassword(email,password)
 .then(()=>{
  alert("Umeingia Admin");
 })
 .catch(error=>{
  alert("Imeshindikana kuingia: "+error.message);
 });
}

function logout(){
 auth.signOut();
}

auth.onAuthStateChanged(user=>{

 isAdmin = !!user;

 document.getElementById("loginBox").style.display =
  isAdmin ? "none" : "block";

 document.getElementById("panel").style.display =
  isAdmin ? "block" : "none";

 document.getElementById("adminStatus").textContent =
  isAdmin ? "Admin ameingia" : "Admin hajatambulika";

 showVideos();

});

// READ VIDEOS FROM FIREBASE

db.ref("videos").on("value",snapshot=>{

 allVideos = {};

 snapshot.forEach(child=>{
  allVideos[child.key] = child.val();
 });

 showVideos();

 document.getElementById("status").textContent =
  Object.keys(allVideos).length + " video zimepatikana";

},error=>{

 document.getElementById("status").textContent =
  "Database error: "+error.message;

});

// DISPLAY VIDEOS

function showVideos(){

 const area = document.getElementById("videos");
 area.innerHTML = "";

 const entries = Object.entries(allVideos);

 if(entries.length===0){
  area.innerHTML="<p class='small'>Hakuna video zilizowekwa bado.</p>";
  return;
 }

 entries.forEach(([id,v])=>{

  if(!v || !v.url) return;

  const card = document.createElement("div");
  card.className="card";

  const player = document.createElement("div");
  player.className="player";

  const frame = document.createElement("iframe");
  frame.src=v.url;
  frame.title=v.title || "Video";
  frame.allow="autoplay; fullscreen; picture-in-picture";
  frame.allowFullscreen=true;

  player.appendChild(frame);

  const info = document.createElement("div");
  info.className="info";

  const heading = document.createElement("h3");
  heading.textContent=v.title || "Video";

  info.appendChild(heading);

  if(isAdmin){

   const del = document.createElement("button");
   del.textContent="FUTA VIDEO";
   del.style.background="#555";

   del.onclick=()=>deleteVideo(id);

   info.appendChild(del);
  }

  card.appendChild(player);
  card.appendChild(info);
  area.appendChild(card);

 });
}

// ADD VIDEO

function addVideo(){

 if(!auth.currentUser){
  alert("Admin lazima aingie kwanza");
  return;
 }

 const title=document.getElementById("title").value.trim();
 const code=document.getElementById("embed").value.trim();

 const match=code.match(/<iframe\b[^>]*\bsrc=["']([^"']+)["']/i);

 if(!title || !match){
  alert("Jaza jina na Embed Code sahihi");
  return;
 }

 const url=match[1];

 let parsed;

 try{
  parsed=new URL(url);
 }catch(e){
  alert("Video URL si sahihi");
  return;
 }

 if(parsed.protocol!=="https:" ||
    parsed.hostname!=="upload18.org" &&
    !parsed.hostname.endsWith(".upload18.org")){
  alert("Tumia Embed Code ya Upload18 pekee");
  return;
 }

 db.ref("videos").push({
  title:title,
  url:url,
  createdAt:Date.now()
 }).then(()=>{

  document.getElementById("title").value="";
  document.getElementById("embed").value="";
  alert("Video imeongezwa kwa mafanikio");

 }).catch(error=>{
  alert("Imeshindikana kuongeza video: "+error.message);
 });

}

// DELETE VIDEO

function deleteVideo(id){

 if(!auth.currentUser) return;

 if(!confirm("Una uhakika unataka kufuta video?"))return;

 db.ref("videos/"+id).remove()
 .then(()=>alert("Video imefutwa"))
 .catch(error=>alert(error.message));
}

</script>

</body>
</html>
