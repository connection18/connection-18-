
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MWIBA 18+ | Adult Videos</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101010;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#080808;
 padding:18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:2px solid #e50914;
}
.logo{font-size:23px;font-weight:bold;color:#e50914}
.badge{background:#e50914;padding:7px 12px;border-radius:5px}
.notice{
 margin:15px;
 padding:15px;
 background:#252525;
 border-radius:8px;
 text-align:center;
}
button{
 background:#e50914;
 color:white;
 border:0;
 padding:10px 15px;
 border-radius:5px;
 cursor:pointer;
}
#videos{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:14px;
 padding:15px;
}
.card{
 background:#202020;
 border-radius:9px;
 overflow:hidden;
}
.card video{
 width:100%;
 aspect-ratio:16/9;
 background:black;
}
.info{padding:10px}
.info h3{font-size:14px}
.search{padding:15px}
.search input{
 width:100%;
 padding:13px;
 border-radius:7px;
 border:0;
}
footer{
 text-align:center;
 padding:25px;
 color:#aaa;
}
</style>
</head>

<body>

<header>
 <div class="logo">MWIBA 18+</div>
 <div class="badge">18+</div>
</header>

<div class="notice">
 <h2>Karibu MWIBA 18+</h2>
 <p>Website hii imekusudiwa watu wenye umri wa miaka 18 au zaidi.</p>
 <button onclick="enterSite()">Nina miaka 18 au zaidi</button>
</div>

<div class="search">
 <input type="text" id="search"
 placeholder="Tafuta video..."
 oninput="filterVideos()">
</div>

<div id="videos"></div>

<footer>
 © 2026 MWIBA 18+ | All Rights Reserved
</footer>

<script>
const videoList = [
 {
  title:"Video 1",
  url:"WEKA_EMBED_VIDEO_URL_HAPA"
 }
];

const container = document.getElementById("videos");

function enterSite(){
 sessionStorage.setItem("adultConfirmed","yes");
 document.querySelector(".notice").style.display="none";
}

if(sessionStorage.getItem("adultConfirmed")==="yes"){
 document.querySelector(".notice").style.display="none";
}

function showVideos(list){
 container.innerHTML="";

 list.forEach(video=>{
  const card=document.createElement("div");
  card.className="card";

  const player=document.createElement("iframe");
  player.src=video.url;
  player.width="100%";
  player.height="200";
  player.allowFullscreen=true;
  player.setAttribute("allow","autoplay; fullscreen");

  const info=document.createElement("div");
  info.className="info";

  const title=document.createElement("h3");
  title.textContent=video.title;

  info.appendChild(title);
  card.appendChild(player);
  card.appendChild(info);
  container.appendChild(card);
 });
}

function filterVideos(){
 const term=document.getElementById("search").value.toLowerCase();
 showVideos(videoList.filter(v=>v.title.toLowerCase().includes(term)));
}

showVideos(videoList);
</script>

</body>
</html>
