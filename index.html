
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>CONNECTION 18+</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial}
header{background:#151515;padding:20px;text-align:center;border-bottom:2px solid red}
header h1{color:#ff2525;margin:0}
.container{max-width:850px;margin:auto;padding:15px}
button{background:#e50914;color:white;border:0;padding:12px;border-radius:6px;cursor:pointer}
input,textarea{width:100%;padding:12px;margin:8px 0;background:#222;color:white;border:1px solid #444;border-radius:6px}
.card{background:#181818;margin:15px 0;border-radius:10px;overflow:hidden}
.poster{position:relative;width:100%;aspect-ratio:16/9;background:#000;cursor:pointer}
.poster img{width:100%;height:100%;object-fit:cover}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#e50914;border-radius:50%;width:65px;height:65px;display:grid;place-items:center;font-size:28px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:black}
.player iframe{width:100%;height:100%;position:absolute;inset:0;border:0}
.info{padding:14px}
.whatsapp-btn{
display:inline-block;
background:#25D366;
color:#fff;
text-decoration:none;
padding:11px 18px;
border-radius:6px;
font-size:14px;
font-weight:bold;
margin-top:8px;
}
.whatsapp-btn:hover{background:#1da851}
#admin{display:none;background:#171717;padding:15px;border-radius:10px;margin:15px 0}
.small{font-size:13px;color:#aaa}
.status{text-align:center;color:#aaa;padding:12px}
</style>
</head>

<body>
<header>
<h1>CONNECTION 18+</h1>
<p>Karibu kwenye maktaba yetu ya video</p>
</header>

<div class="container">
<button onclick="showLogin()">ADMIN LOGIN</button>

<div id="admin">
<h2>ADMIN DASHBOARD</h2>

<div id="loginBox">
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Admin password">
<button onclick="login()">INGIA</button>
</div>

<div id="panel" style="display:none">
<h3>Ongeza video mpya</h3>
<input id="title" placeholder="Jina la video">
<textarea id="embed" rows="4" placeholder="Bandika Embed Code hapa"></textarea>
<label>Thumbnail URL ya picha ya GitHub</label>
<input id="thumbnail" placeholder="Bandika link ya picha hapa">
<button onclick="addVideo()">ADD VIDEO</button>
<button onclick="logout()" style="background:#555">LOGOUT</button>
</div>

<p class="small" id="adminStatus">Admin wa tovuti</p>
</div>

<h2>Video Zetu</h2>
<div class="status" id="status">Inaunganisha...</div>
<div id="videos"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCYCriveNctKXLDV3nvhwskrx4N_jCTziE",
  authDomain: "connection-18-c5446.firebaseapp.com",
  databaseURL: "https://connection-18-c5446-default-rtdb.firebaseio.com",
  projectId: "connection-18-c5446",
  storageBucket: "connection-18-c5446.firebasestorage.app",
  messagingSenderId: "456365988687",
  appId: "1:456365988687:web:f1fbb5ec4996c96b79833a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let isAdmin = false;
let allVideos = {};

function showLogin(){
 document.getElementById("admin").style.display="block";
}

function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email || !password){
  alert("Jaza email na password");
  return;
 }

 auth.signInWithEmailAndPassword(email,password)
 .then(()=>alert("Umeingia Admin"))
 .catch(error=>alert(error.message));
}

function logout(){
 auth.signOut();
}

auth.onAuthStateChanged(user=>{
 isAdmin=!!user;

 document.getElementById("loginBox").style.display=isAdmin?"none":"block";
 document.getElementById("panel").style.display=isAdmin?"block":"none";
 document.getElementById("adminStatus").textContent=isAdmin?"Admin ameingia":"Admin hajatambulika";

 showVideos();
});

db.ref("videos").on("value",snapshot=>{
 allVideos={};

 snapshot.forEach(child=>{
  allVideos[child.key]=child.val();
 });

 showVideos();
 document.getElementById("status").textContent=
 Object.keys(allVideos).length+" video zimepatikana";
},error=>{
 document.getElementById("status").textContent="Database error: "+error.message;
});

function showVideos(){
 const area=document.getElementById("videos");
 area.innerHTML="";

 const entries=Object.entries(allVideos);

 if(entries.length===0){
  area.innerHTML="<p class='small'>Hakuna video zilizowekwa bado.</p>";
  return;
 }

 entries.forEach(([id,v])=>{
  if(!v || !v.url)return;

  const card=document.createElement("div");
  card.className="card";

  const heading=document.createElement("h3");
  heading.textContent=v.title||"Video";

  const info=document.createElement("div");
  info.className="info";
  info.appendChild(heading);

  // KITufe cha WhatsApp kwa kila video
  const wa=document.createElement("a");
  wa.className="whatsapp-btn";
  wa.textContent="WHATSAPP";
  const message="Habari, naomba maelezo kuhusu video: "+(v.title||"Video");
  wa.href="https://wa.me/255711606039?text="+encodeURIComponent(message);
  wa.target="_blank";
  wa.rel="noopener noreferrer";
  info.appendChild(wa);

  if(v.thumbnail){
   const poster=document.createElement("div");
   poster.className="poster";

   const img=document.createElement("img");
   img.src=v.thumbnail;
   img.alt=v.title||"Thumbnail";
   img.loading="lazy";

   const play=document.createElement("div");
   play.className="play";
   play.textContent="▶";

   poster.appendChild(img);
   poster.appendChild(play);

   poster.onclick=()=>{
    const player=document.createElement("div");
    player.className="player";

    const frame=document.createElement("iframe");
    frame.src=v.url;
    frame.title=v.title||"Video";
    frame.allow="autoplay; fullscreen; picture-in-picture";
    frame.allowFullscreen=true;

    player.appendChild(frame);
    poster.replaceWith(player);
   };

   card.appendChild(poster);
  }else{
   const player=document.createElement("div");
   player.className="player";

   const frame=document.createElement("iframe");
   frame.src=v.url;
   frame.title=v.title||"Video";
   frame.allow="autoplay; fullscreen; picture-in-picture";
   frame.allowFullscreen=true;

   player.appendChild(frame);
   card.appendChild(player);
  }

  if(isAdmin){
   const del=document.createElement("button");
   del.textContent="FUTA VIDEO";
   del.style.background="#555";
   del.style.marginTop="10px";
   del.onclick=()=>deleteVideo(id);
   info.appendChild(del);
  }

  card.appendChild(info);
  area.appendChild(card);
 });
}

function addVideo(){
 if(!auth.currentUser){
  alert("Admin lazima aingie kwanza");
  return;
 }

 const title=document.getElementById("title").value.trim();
 const code=document.getElementById("embed").value.trim();
 const thumbnail=document.getElementById("thumbnail").value.trim();

 const match=code.match(/<iframe\b[^>]*\bsrc=["']([^"']+)["']/i);

 if(!title || !match || !thumbnail){
  alert("Jaza jina, Embed Code na Thumbnail URL");
  return;
 }

 let parsed, imageURL;

 try{
  parsed=new URL(match[1]);
  imageURL=new URL(thumbnail);
 }catch(e){
  alert("Link si sahihi");
  return;
 }

 if(parsed.protocol!=="https:" ||
    !(parsed.hostname==="upload18.org" || parsed.hostname.endsWith(".upload18.org"))){
  alert("Tumia Embed Code ya Upload18 pekee");
  return;
 }

 if(imageURL.protocol!=="https:" ||
    !(imageURL.hostname==="github.com" ||
      imageURL.hostname==="raw.githubusercontent.com")){
  alert("Tumia link ya picha ya GitHub");
  return;
 }

 db.ref("videos").push({
  title:title,
  url:parsed.href,
  thumbnail:imageURL.href,
  createdAt:Date.now()
 }).then(()=>{
  document.getElementById("title").value="";
  document.getElementById("embed").value="";
  document.getElementById("thumbnail").value="";
  alert("Video imeongezwa kwa mafanikio");
 }).catch(error=>alert(error.message));
}

function deleteVideo(id){
 if(!auth.currentUser)return;
 if(!confirm("Una uhakika unataka kufuta video?"))return;

 db.ref("videos/"+id).remove()
 .then(()=>alert("Video imefutwa"))
 .catch(error=>alert(error.message));
}
</script>
</body>
</html>
